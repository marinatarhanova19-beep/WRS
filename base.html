<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>{{ title or "WRS" }}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-mark">WRS</div>
    <div>
      <div class="topbar-title">Мониторинг смен</div>
      <div class="topbar-sub">v{{ ver or "1.1" }}</div>
    </div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <div class="toast" id="toast"></div>
  <script>
    function toast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window.__tt);
      window.__tt = setTimeout(function(){ el.classList.remove('show'); }, 1800);
    }
    function copyText(t) {
      if (!t) return;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(t).then(function(){ toast('Скопировано'); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = t; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        toast('Скопировано');
      }
    }
  </script>
</body>
</html>
