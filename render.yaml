services:
  - type: web
    name: wrs-mobile
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: WRS_DATA_DIR
        value: /tmp/wrs_data
