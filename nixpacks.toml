providers = ["python"]

[variables]
PYTHONUNBUFFERED = "1"
WRS_DATA_DIR = "/tmp/wrs_data"

[phases.setup]
nixPkgs = ["python312", "gcc"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -U pip && pip install -r requirements.txt"
]

[start]
cmd = "python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
